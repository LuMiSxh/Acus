[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/LuMiSxh/Acus"

[workspace.dependencies]
acus-walk = { path = "crates/acus-walk" }
acus-syntax = { path = "crates/acus-syntax", default-features = false }
acus-edit = { path = "crates/acus-edit" }
acus-search = { path = "crates/acus-search" }
acus-usage = { path = "crates/acus-usage" }
acus-decide = { path = "crates/acus-decide" }
anstyle = "1"
anyhow = "1.0.104"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
insta = "1.49.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
tempfile = "3.27.0"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-svelte-ng = "1.0.2"
tree-sitter-swift = "0.7.3"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
