[package]
name = "acus-syntax"
description = "tree-sitter outlines and addresses for acus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["lang-rust", "lang-swift", "lang-ts", "lang-python", "lang-markdown", "lang-svelte", "lang-data"]
lang-rust = ["dep:tree-sitter-rust"]
lang-swift = ["dep:tree-sitter-swift"]
lang-ts = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-markdown = ["dep:tree-sitter-md"]
lang-svelte = ["lang-ts", "dep:tree-sitter-svelte-ng"]
lang-data = ["dep:tree-sitter-toml-ng", "dep:tree-sitter-json", "dep:tree-sitter-yaml"]

[dependencies]
serde.workspace = true
tree-sitter.workspace = true
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-md = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-svelte-ng = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-toml-ng = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
