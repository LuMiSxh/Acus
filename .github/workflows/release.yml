name: Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag (e.g. v0.1.0) — must match Cargo.toml version"
                required: true
                type: string

permissions:
    contents: write

env:
    CARGO_TERM_COLOR: always

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Verify tag matches Cargo.toml version
              run: |
                  cargo_version="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
                  tag_version="${{ inputs.tag }}"
                  tag_version="${tag_version#v}"
                  if [ "$cargo_version" != "$tag_version" ]; then
                    echo "::error::Tag version ($tag_version) does not match Cargo.toml version ($cargo_version)"
                    exit 1
                  fi

    build:
        needs: validate
        strategy:
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                      artifact: acus-x86_64-unknown-linux-gnu
                    - target: aarch64-unknown-linux-gnu
                      os: ubuntu-latest
                      artifact: acus-aarch64-unknown-linux-gnu
                    - target: x86_64-apple-darwin
                      os: macos-latest
                      artifact: acus-x86_64-apple-darwin
                    - target: aarch64-apple-darwin
                      os: macos-latest
                      artifact: acus-aarch64-apple-darwin
                    - target: x86_64-pc-windows-msvc
                      os: windows-latest
                      artifact: acus-x86_64-pc-windows-msvc
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust toolchain
              run: |
                  rustup update stable
                  rustup default stable
                  rustup target add ${{ matrix.target }}

            - name: Install cross-compilation tools (aarch64-linux)
              if: matrix.target == 'aarch64-unknown-linux-gnu'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu
                  echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

            - name: Build release binary
              run: cargo build --release --locked -p acus-cli --features cmd-decide,cmd-update --target ${{ matrix.target }}

            - name: Install coreutils (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew install coreutils
                  echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

            - name: Package binary (unix)
              if: runner.os != 'Windows'
              run: |
                  cd target/${{ matrix.target }}/release
                  tar czf ../../../${{ matrix.artifact }}.tar.gz acus
                  cd ../../..
                  sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

            - name: Package binary (windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  Compress-Archive -Path "target/${{ matrix.target }}/release/acus.exe" -DestinationPath "${{ matrix.artifact }}.zip"
                  (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact }}.zip.sha256"

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact }}
                  path: |
                      ${{ matrix.artifact }}.tar.gz
                      ${{ matrix.artifact }}.tar.gz.sha256
                      ${{ matrix.artifact }}.zip
                      ${{ matrix.artifact }}.zip.sha256
                  if-no-files-found: error

    release:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Create git tag
              run: |
                  git tag "${{ inputs.tag }}"
                  git push origin "${{ inputs.tag }}"

            - name: Extract changelog for this version
              id: changelog
              run: |
                  version="${{ inputs.tag }}"
                  version="${version#v}"
                  if [ -f CHANGELOG.md ]; then
                    awk "/^## \[${version}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release_notes.md
                  fi
                  if [ ! -s release_notes.md ]; then
                    echo "Release ${{ inputs.tag }}" > release_notes.md
                  fi

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${{ inputs.tag }}" \
                    --title "${{ inputs.tag }}" \
                    --notes-file release_notes.md \
                    artifacts/*
